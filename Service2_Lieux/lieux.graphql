type Query {
  geocode(req: String!): Location                        
  geocode_arr_dep(start: String!, end: String!): Trip  
  get_parks: [Location]   
  get_nearest_park(
    start_lat: Float!
    start_lon: Float!
    end_lat: Float!
    end_lon: Float!
  ): NearestParkResult 
}

type Location {
  label: String                                       
  lat: Float!                                         
  lon: Float!                                        
}

type Trip {
  start: Location                                        
  end: Location   
  nearest_park: NearestParkResult                                        
}

type NearestParkResult {
    location: Location
    total_distance_km: Float
}
