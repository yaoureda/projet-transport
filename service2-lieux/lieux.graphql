enum LocationType {
  PARK
  TOILET
}

type Query {
  geocode(req: String!): Location                        
  geocode_arr_dep(start: String!, end: String!, type: LocationType): Trip  
  get_locations(type: LocationType!): [Location]   
  get_nearest_location(
    type: LocationType!
    start_lat: Float!
    start_lon: Float!
    end_lat: Float!
    end_lon: Float!
  ): NearestLocationResult 
}

type Location {
  label: String                                       
  lat: Float!                                         
  lon: Float!                                        
}

type Trip {
  start: Location!                                        
  end: Location!   
  nearest_location: NearestLocationResult                                        
}

type NearestLocationResult {
    location: Location
    total_distance_km: Float
}
